<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar Palpite - Bolão da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🏆 Bolão da Copa</a>
            <a href="{% url 'home' %}" class="btn btn-sm btn-outline-light">Voltar aos Jogos</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title h5 text-center mb-4">Seu Palpite</h3>
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <div class="text-center flex-fill">
                                    <h5 class="mb-2">{{ partida.time_mandante }}</h5>
                                    <input type="number" name="gols_mandante" class="form-control form-control-lg text-center mx-auto" style="max-width: 80px;" min="0" required value="{{ palpite_existente.gols_mandante|default:'' }}">
                                </div>
                                
                                <div class="fw-bold fs-4 text-muted px-3">X</div>
                                
                                <div class="text-center flex-fill">
                                    <h5 class="mb-2">{{ partida.time_visitante }}</h5>
                                    <input type="number" name="gols_visitante" class="form-control form-control-lg text-center mx-auto" style="max-width: 80px;" min="0" required value="{{ palpite_existente.gols_visitante|default:'' }}">
                                </div>
                            </div>

                            <p class="text-muted small text-center mb-4">
                                📅 Jogo em: {{ partida.data_hora|date:"d/m/Y - H:i" }}
                            </p>

                            <button type="submit" class="btn btn-success w-100 btn-lg">Salvar Palpite</button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
