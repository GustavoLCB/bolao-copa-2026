{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">🏆 Entrar no Bolão</h4>
                </div>
                <div class="card-body p-4">
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <!-- Campos de Usuário e Senha -->
                        {{ form.as_p }}
                        
                        <!-- Botão de Entrar -->
                        <button type="submit" class="btn btn-success w-100 mt-3">
                            Entrar
                        </button>
                    </form>
                    
                    <!-- NOTA: O botão de criar conta foi removido para manter o bolão privado. -->
                         
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
