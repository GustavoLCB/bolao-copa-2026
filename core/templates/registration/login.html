<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Bolão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-success {
            background-color: #198754;
            border: none;
        }
        .btn-success:hover {
            background-color: #146c43;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container text-center">
        <h2 class="mb-4">🏆 Entrar no Bolão</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Usuário:</label>
                {{ form.username }}
            </div>
            
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Senha:</label>
                {{ form.password }}
            </div>
            
            <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Entrar</button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        
        <div class="mt-4">
            <p class="mb-1 text-muted">Ainda não tem uma conta?</p>
            <a href="{% url 'registrar' %}" class="btn btn-outline-secondary w-100 fw-bold">Criar nova conta</a>
        </div>
    </div>
</div>

<script>
    // Script rápido para injetar a classe form-control nos campos sem precisar mexer no Python
    document.addEventListener("DOMContentLoaded", function() {
        let inputs = document.querySelectorAll("input[type='text'], input[type='password']");
        inputs.forEach(function(input) {
            input.classList.add("form-control");
        });
    });
</script>

</body>
</html>
