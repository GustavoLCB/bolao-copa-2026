<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bolão da Copa 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="h4 fw-bold">🏆 Bolão da Copa</h2>
            <p class="text-muted small">Crie sua conta e participe!</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 fw-bold mt-3 shadow-sm">Cadastrar e Entrar</button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none text-muted small">Já tem uma conta? <strong>Faça Login</strong></a>
        </div>
    </div>

</body>
</html>
